[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg5000-tcn-classification"
version = "0.1.0"
description = "Modular ECG5000 anomaly classification project with a TCN backbone"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "matplotlib",
  "joblib",
  "torch",
  "pytorch-lightning",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ecg5000-train = "ecg_project.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
